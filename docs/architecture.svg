<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" role="img" aria-label="svg-atelierのアーキテクチャ図" color="#768390">
  <title>svg-atelierのアーキテクチャ</title>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .accent-box { fill: none; stroke: #b07fd4; stroke-width: 1.5; }
    .label { font: 600 14px 'Hiragino Sans', 'Noto Sans JP', sans-serif; fill: currentColor; }
    .small { font: 400 11.5px 'Hiragino Sans', 'Noto Sans JP', sans-serif; fill: currentColor; }
    .accent-label { font: 700 14px 'Hiragino Sans', 'Noto Sans JP', sans-serif; fill: #b07fd4; }
    .arrow { stroke: currentColor; stroke-width: 1.5; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="60" width="150" height="100" rx="8" class="box"/>
  <text x="40" y="90" class="label">入力SVG</text>
  <text x="40" y="114" class="small">貼り付け</text>
  <text x="40" y="132" class="small">DOMParserで解析</text>

  <rect x="230" y="60" width="390" height="100" rx="8" class="accent-box"/>
  <text x="250" y="88" class="accent-label">変換パイプライン(DOM上で順に適用)</text>
  <text x="250" y="112" class="small">optimize: メタデータ・コメント除去、数値丸め</text>
  <text x="250" y="130" class="small">a11y: viewBox確保、aria-hidden / role+title</text>
  <text x="250" y="148" class="small">colors: 選択色をcurrentColorへ置換</text>

  <rect x="680" y="20" width="160" height="80" rx="8" class="box"/>
  <text x="700" y="48" class="label">プレビュー</text>
  <text x="700" y="72" class="small">ライト / ダーク /</text>
  <text x="700" y="90" class="small">アクセント背景</text>

  <rect x="680" y="120" width="160" height="80" rx="8" class="box"/>
  <text x="700" y="148" class="label">整形出力</text>
  <text x="700" y="172" class="small">インデント整形</text>
  <text x="700" y="190" class="small">サイズ比較・コピー</text>

  <path class="arrow" d="M170 110 H222"/>
  <path class="arrow" d="M620 110 H672 V64"/>
  <path class="arrow" d="M620 110 H672 V156"/>
</svg>
